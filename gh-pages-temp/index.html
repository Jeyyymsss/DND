<!DOCTYPE html>
<html lang="en">

<head>\n    <base href="./">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND</title>
    <!-- Favicon / Tab icon -->
    <link rel="icon" href="http://localhost/logo.jpg" type="image/x-icon">
    <link rel="apple-touch-icon" href="http://localhost/logo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Archivo font (Bold) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&display=swap" rel="stylesheet">


    <style>
        /* Prevent page scrolling */
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        .font-streetwear {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.05em;
        }

        .font-logo {
            font-family: 'Playfair Display', serif;
        }

        .font-nav {
            font-family: 'Archivo', sans-serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.15em;
        }

        /* Custom rich gradient matching Image 2 */
        .bg-gradient-dnd {
            background: radial-gradient(circle at center, #0e1e17 0%, #060a08 100%);
        }

        /* Fullscreen background video styling */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>

<body
    class="bg-gradient-dnd text-white font-nav min-h-screen flex flex-col justify-between antialiased selection:bg-emerald-800 selection:text-white">



    <main class="relative h-screen">

        <!-- Fullscreen background video (uses public/DND TEST.mp4) -->
        <video id="bg-video" autoplay muted loop playsinline crossorigin="anonymous">
            <source src="DND TEST.mp4" type="video/mp4">
        </video>

        <!-- Logo at top -->
        <div class="absolute top-0 left-0 right-0 flex justify-center pt-6 z-10">
            <img src="dnd_oldlogo-removebg.png" alt="DND Logo" class="w-full max-w-xs h-auto">
        </div>

        <!-- Back button (uses history.back) -->
        
        <!-- Centered navigation -->
        <div class="absolute inset-0 flex items-center justify-center z-10">
            <nav class="flex flex-col items-center gap-4">
                <a href="./shirt-collections"
                    class="nav-link inline-block transform scale-y-[0.8] tracking-[0.25em] font-bold origin-center transition duration-200 hover:text-amber-100">
                    COLLECTION
                </a>

                <a href="./shop"
                    class="nav-link inline-block transform scale-y-[0.8] tracking-[0.25em] font-bold origin-center transition duration-200 hover:text-amber-100">
                    SHOP
                </a>

                <a href="./help"
                    class="nav-link inline-block transform scale-y-[0.8] tracking-[0.25em] font-bold origin-center transition duration-200 hover:text-amber-100">
                    HELP
                </a>

                <a href="./contacts"
                    class="nav-link inline-block transform scale-y-[0.8] tracking-[0.25em] font-bold origin-center transition duration-200 hover:text-amber-100">
                    CONTACT
                </a>
            </nav>
        </div>

        <!-- Content yield for child pages -->
        <div class="absolute inset-0 flex items-start justify-center z-20 pt-36">
            <div class="w-full">
                            </div>
        </div>

    </main>
    <footer class="w-full p-6 flex justify-end items-center z-50">
        <button
            class="bg-white text-black hover:bg-amber-100 font-sans font-medium text-xs py-2.5 px-4 rounded-full flex items-center space-x-2 shadow-xl transition-all duration-300 hover:scale-105 active:scale-95 relative">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
                </path>
            </svg>
            <span class="tracking-normal font-semibold">Chat</span>

            <span
                class="absolute -top-1.5 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[9px] font-bold text-white ring-2 ring-emerald-950">
                1
            </span>
        </button>
    </footer>

</body>

</html>
